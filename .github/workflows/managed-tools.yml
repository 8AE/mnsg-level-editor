name: Managed offline tools
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  tools:
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: windows-2022
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Native MSVC build environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: amd64
      - name: Python for bounded Windows source extraction
        if: runner.os == 'Windows'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Restore exact verified bundle
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: resources/managed-tools
          key: managed-tools-v1-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('scripts/build-managed-tools.mjs', 'scripts/extract-llvm-source.py', 'scripts/managed-tools-contract.mjs', 'scripts/patches/**', 'resources/managed-template/**') }}
          # Exact compatible Mac bundles: source pins, patch and flags are unchanged.
          # Revalidate their entire manifest before reuse; never use a Windows fallback.
          restore-keys: ${{ matrix.platform == 'darwin' && format('managed-tools-v1-darwin-{0}-0f9df03fee5655851740a5bade20fba5e8afceedd1c86e94626f259a319b3c95', matrix.arch) || '' }}
      - name: Validate restored bundle before skipping any compilation
        id: restored
        run: >-
          node --input-type=module -e
          "import fs from 'node:fs/promises'; import {validateBundle} from './scripts/managed-tools-contract.mjs';
          const present=await fs.access('resources/managed-tools/manifest.json').then(()=>true,()=>false);
          if(present) await validateBundle('resources/managed-tools');
          await fs.appendFile(process.env.GITHUB_OUTPUT, 'ready='+present+'\n');"
      - name: Build pinned native MIPS compiler and mod tool
        if: steps.restored.outputs.ready != 'true'
        run: node scripts/build-managed-tools.mjs --generator=Ninja --jobs=3
      - name: Verify complete bundle and offline compile/link/NRM contract
        run: node scripts/smoke-managed-tools.mjs
      - name: Archive bundle preserving native executable permissions
        run: tar -czf managed-tools-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz -C resources managed-tools
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: managed-tools-${{ matrix.platform }}-${{ matrix.arch }}
          path: managed-tools-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
      - name: Preserve completed compilers after a later build or staging failure
        id: recovery
        if: failure()
        timeout-minutes: 12
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          import os from 'node:os';
          import path from 'node:path';
          const work = process.env.MNSG_RECOVERY_WORK_DIR || path.join(os.tmpdir(), 'mnsg-managed-tool-build');
          const suffix = process.platform === 'win32' ? '.exe' : '';
          const present = (name) => fs.stat(path.join(work, name)).then((s) => s.isFile() && s.size > 0, () => false);
          const binaries = [`llvm-build/bin/clang${suffix}`, `llvm-build/bin/lld${suffix}`];
          if (!(await Promise.all(binaries.map(present))).every(Boolean)) {
            console.log('No completed native LLVM pair is available for diagnostics.');
            process.exit(0);
          }
          const llvm = 'llvm-project-21.1.8.src';
          const entries = [...binaries, 'llvm-build/CMakeCache.txt', 'recomp-build/CMakeCache.txt', 'N64Recomp',
            `${llvm}.tar.xz`, `${llvm}/llvm/CMakeLists.txt`, `${llvm}/LICENSE.TXT`, `${llvm}/llvm/LICENSE.TXT`,
            `${llvm}/llvm/include/llvm/Support/LICENSE.TXT`, `${llvm}/llvm/lib/Support/BLAKE3/LICENSE`,
            `${llvm}/clang/LICENSE.TXT`, `${llvm}/lld/LICENSE.TXT`,
            ...['__libunwind_config.h', 'libunwind.h', 'mach-o/compact_unwind_encoding.h', 'unwind.h', 'unwind_arm_ehabi.h', 'unwind_itanium.h']
              .map((name) => `${llvm}/libunwind/include/${name}`)];
          const modTool = `recomp-build/RecompModTool${suffix}`;
          const modToolPresent = await present(modTool);
          if (modToolPresent) entries.push(modTool);
          let bytes = 0, files = 0;
          const canonicalWork = await fs.realpath(work);
          const inspect = async (target) => {
            if (/\.(z64|v64|n64|rom|nrm|mnsge)$/i.test(target)) throw new Error('Game/project data is excluded from compiler diagnostics');
            let stat = await fs.lstat(target);
            if (stat.isSymbolicLink()) {
              const actual = await fs.realpath(target);
              const relative = path.relative(canonicalWork, actual);
              if (relative.startsWith('..') || path.isAbsolute(relative)) throw new Error('Diagnostic source link escapes its native work directory');
              stat = await fs.stat(actual);
              if (!stat.isFile()) throw new Error('Diagnostic directory links are excluded');
            }
            if (stat.isDirectory()) {
              for (const name of await fs.readdir(target)) await inspect(path.join(target, name));
            } else if (stat.isFile()) {
              bytes += stat.size; files++;
              if (bytes > 1024 ** 3) throw new Error('Compiler recovery snapshot exceeds its 1 GiB input budget');
            } else throw new Error('Unsupported diagnostic source entry');
          };
          for (const name of entries) await inspect(path.join(work, name));
          const cacheHomes = {};
          for (const name of ['llvm-build', 'recomp-build']) {
            const cache = await fs.readFile(path.join(work, name, 'CMakeCache.txt'), 'utf8');
            cacheHomes[name] = cache.match(/^CMAKE_HOME_DIRECTORY:[^=]+=(.*)$/m)?.[1]?.trim();
          }
          await fs.writeFile(path.join(work, 'recovery-info.json'), JSON.stringify({
            format: 'mnsg-native-compiler-diagnostics', version: 1, diagnosticOnly: true, automaticAdmission: false,
            platform: process.platform, arch: process.arch, originalWorkDirectory: canonicalWork,
            cacheSourceDirectories: cacheHomes, modToolPresent, entries, files, uncompressedBytes: bytes,
            recovery: 'Review pinned source/cache identities and restore their recorded directories before rerunning --stage-only. No automatic cache or release reuse.',
          }, null, 2) + '\n');
          entries.push('recovery-info.json');
          const archive = path.resolve(`managed-tools-recovery-${process.platform}-${process.arch}.tar.gz`);
          execFileSync('tar', ['-czhf', archive, '-C', work, ...entries], { stdio: 'inherit', timeout: 600000, env: { ...process.env, COPYFILE_DISABLE: '1' } });
          const packed = (await fs.stat(archive)).size;
          if (packed > 512 * 1024 ** 2) { await fs.rm(archive); throw new Error('Compiler recovery archive exceeds its 512 MiB upload budget'); }
          console.log(`Diagnostic compiler archive: ${files} files, ${bytes} input bytes, ${packed} compressed bytes.`);
          if (process.env.GITHUB_OUTPUT) await fs.appendFile(process.env.GITHUB_OUTPUT, 'saved=true\n');
          JS
      - name: Upload preserved compilers for manual diagnostic recovery
        if: failure() && steps.recovery.outputs.saved == 'true'
        timeout-minutes: 10
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-compiler-diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: managed-tools-recovery-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
