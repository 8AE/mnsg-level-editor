name: Windows source dependency probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Native MSVC build environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: amd64
      - name: Verify extraction safety fixtures
        run: python -u scripts/extract-llvm-source.py --self-test
      - name: Admit both pinned sources and compile LLVM consumer plus RecompModTool
        run: node scripts/build-managed-tools.mjs --source-compile-probe --generator=Ninja --jobs=3
      - name: Verify an unrelated source root is rejected by the same preflight
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { mkdir } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          import os from 'node:os';
          import path from 'node:path';
          const wrong = path.join(os.tmpdir(), 'mnsg-unrelated-source-fixture');
          await mkdir(path.join(wrong, 'llvm'), { recursive: true });
          let rejected = false;
          try {
            execFileSync(process.execPath, ['scripts/build-managed-tools.mjs', '--stage-only', '--preflight-only', `--llvm-source=${wrong}`], { encoding: 'utf8', stdio: 'pipe' });
          } catch (error) {
            rejected = `${error.stdout || ''}${error.stderr || ''}`.includes('LLVM build cache source root mismatch');
          }
          if (!rejected) throw new Error('Unrelated LLVM source root was not rejected by source identity admission');
          console.log('Unrelated source-root fixture rejected; the prior native probe admitted the real TEMP short/long aliases.');
          JS
